server {
    listen 80;
    root /usr/share/nginx/html;

    # routing côté client (react-router-dom) : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # le service worker PWA ne doit jamais être mis en cache par le navigateur
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
